name: Laplace-Native
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-verification
  cancel-in-progress: false
  queue: max
env:
  LAPLACE_OPERATIONS: ${{ github.workspace }}/.operations/Laplace-Operations
  LAPLACE_HOST_LOCK: ${{ vars.LAPLACE_HOST_LOCK }}
jobs:
  inputs:
    runs-on: [self-hosted, laplace, Laplace-Native, staging]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, clean: false }
      - name: Prepare the exact candidate while retaining pinned dependency sources
        run: bash scripts/ci-checkout.sh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Operations
          ref: e7b2014826239fc5af9d74763ecb232d4ceafe14
          path: .operations/Laplace-Operations
          token: ${{ secrets.LAPLACE_CHECKOUT }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Engine
          ref: de00247c295c20b5fd37ee072c2c313be1663f6b
          path: .engine/Laplace-Engine
          token: ${{ secrets.LAPLACE_CHECKOUT }}
          persist-credentials: false
      - name: Build the canonical cache generator against this Native revision
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_NATIVE="$GITHUB_WORKSPACE" LAPLACE_MANIFEST="$GITHUB_WORKSPACE/manifest"
          cmake -S .engine/Laplace-Engine -B "$LAPLACE_BUILD/Laplace-Engine/icx-release" -G Ninja -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_BUILD_TYPE=Release -DLAPLACE_NATIVE="$LAPLACE_NATIVE"
          cmake --build "$LAPLACE_BUILD/Laplace-Engine/icx-release" --target laplace_engine
          python3 scripts/ci-inputs.py prepare "$RUNNER_TEMP/native-generated-inputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --engine "$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace" --ucd "${LAPLACE_UCD:-/vault/Data/UCD}/Public/UCD/latest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-generated-inputs
          path: ${{ runner.temp }}/native-generated-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
  native:
    needs: inputs
    runs-on: [self-hosted, laplace, Laplace-Native, staging]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { preset: [icx-release, gcc-release] }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, clean: false }
      - name: Prepare the exact candidate while retaining pinned dependency sources
        run: bash scripts/ci-checkout.sh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Operations
          ref: e7b2014826239fc5af9d74763ecb232d4ceafe14
          path: .operations/Laplace-Operations
          token: ${{ secrets.LAPLACE_CHECKOUT }}
          persist-credentials: false
      - name: Download this run's generated canonical inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-generated-inputs
          path: ${{ runner.temp }}/native-inputs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.preset }}
      - name: Verify and select the exact input closure
        env:
          PRESET: ${{ matrix.preset }}
        run: python3 scripts/ci-inputs.py verify "$RUNNER_TEMP/native-inputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PRESET"
      - name: Build pinned dependencies and Native
        env:
          PRESET: ${{ matrix.preset }}
        run: bash scripts/ci-build.sh "$PRESET"
      - name: Execute tests on the local verification host
        env:
          PRESET: ${{ matrix.preset }}
        run: ctest --test-dir "$LAPLACE_BUILD/Laplace-Native/$PRESET" --output-on-failure --output-junit "$RUNNER_TEMP/native-$PRESET.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-${{ matrix.preset }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-${{ matrix.preset }}.xml
          if-no-files-found: error
      - name: Publish the inputs that passed local verification
        if: matrix.preset == 'icx-release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-prepared-inputs
          path: ${{ runner.temp }}/native-inputs-${{ github.run_id }}-${{ github.run_attempt }}-icx-release
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, laplace, Laplace-Native, staging]
    timeout-minutes: 5
    steps:
      - name: Deploy the verified Native revision through Operations
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/SaltyPatron/Laplace-Operations/dispatches -f event_type=main-merged -f "client_payload[repository]=$SOURCE_REPOSITORY" -f "client_payload[sha]=$SOURCE_SHA"
          echo "Dispatched Operations with $SOURCE_REPOSITORY at $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
