name: Laplace-Native
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-verification
  cancel-in-progress: false
  queue: max
env:
  LAPLACE_OPERATIONS: ${{ github.workspace }}/.operations/Laplace-Operations
  LAPLACE_HOST_LOCK: ${{ vars.LAPLACE_HOST_LOCK }}
jobs:
  inputs:
    runs-on: [self-hosted, laplace, Laplace-Native, staging]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, clean: false }
      - name: Prepare the exact candidate while retaining pinned dependency sources
        run: bash scripts/ci-checkout.sh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Operations
          ref: main
          path: .operations/Laplace-Operations
          token: ${{ secrets.LAPLACE_CHECKOUT }}
          persist-credentials: false
      # Sibling revisions from the version lock (Laplace-Operations components.lock.tsv), never pinned SHAs.
      - name: Sibling revisions from the version lock
        id: lock
        run: awk -F'\t' '!/^#/ && NF == 3 { print $1 "=" $3 }' .operations/Laplace-Operations/components.lock.tsv | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Engine
          ref: ${{ steps.lock.outputs.engine }}
          path: .engine/Laplace-Engine
          token: ${{ secrets.LAPLACE_CHECKOUT }}
          persist-credentials: false
      - name: Build the canonical cache generator against this Native revision
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_NATIVE="$GITHUB_WORKSPACE" LAPLACE_MANIFEST="$GITHUB_WORKSPACE/manifest"
          native_pkg=$(bash .operations/Laplace-Operations/native-package.sh "$GITHUB_WORKSPACE")/lib/cmake/LaplaceNative
          stage_dir="$LAPLACE_BUILD/Laplace-Native/run-inputs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$stage_dir" && mkdir -p "$(dirname "$stage_dir")"
          cmake -S .engine/Laplace-Engine -B "$LAPLACE_BUILD/Laplace-Engine/icx-release" -G Ninja -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_BUILD_TYPE=Release -DLaplaceNative_DIR:PATH="$native_pkg" -DLAPLACE_OPERATIONS:PATH="$LAPLACE_OPERATIONS" -DLAPLACE_TIER0:FILEPATH="$stage_dir/tier0.bin"
          cmake --build "$LAPLACE_BUILD/Laplace-Engine/icx-release" --target laplace_engine
          python3 scripts/ci-inputs.py prepare "$stage_dir" --engine "$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace" --ucd "${LAPLACE_UCD:-/vault/Data/UCD}/Public/UCD/latest"
          chmod -R a+rX "$stage_dir"
  native:
    needs: inputs
    runs-on: [self-hosted, laplace, Laplace-Native, staging]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { preset: [icx-release, gcc-release] }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, clean: false }
      - name: Prepare the exact candidate while retaining pinned dependency sources
        run: bash scripts/ci-checkout.sh
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Operations
          ref: main
          path: .operations/Laplace-Operations
          token: ${{ secrets.LAPLACE_CHECKOUT }}
          persist-credentials: false
      - name: Stage this run's generated canonical inputs
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          dest="$RUNNER_TEMP/native-inputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PRESET"
          rm -rf "$dest" && mkdir -p "$dest"
          cp -a --reflink=auto --no-preserve=ownership "$LAPLACE_BUILD/Laplace-Native/run-inputs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/." "$dest/"
      - name: Verify and select the exact input closure
        env:
          PRESET: ${{ matrix.preset }}
        run: python3 scripts/ci-inputs.py verify "$RUNNER_TEMP/native-inputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PRESET"
      - name: Build pinned dependencies and Native
        env:
          PRESET: ${{ matrix.preset }}
        run: bash scripts/ci-build.sh "$PRESET"
      - name: Execute tests on the local verification host
        env:
          PRESET: ${{ matrix.preset }}
        run: ctest --test-dir "$LAPLACE_BUILD/Laplace-Native/$PRESET" --output-on-failure --output-junit "$RUNNER_TEMP/native-$PRESET.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: native-${{ matrix.preset }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-${{ matrix.preset }}.xml
          if-no-files-found: warn
          retention-days: 1
      - name: Publish the inputs that passed local verification to shared runner cache
        if: matrix.preset == 'icx-release'
        run: |
          shared_root="${LAPLACE_BUILD%/agents/*}/native-prepared-inputs"
          mkdir -p "$shared_root"
          tmp_dir=$(mktemp -d "$shared_root/.stage.XXXXXXXX")
          cp -a --reflink=auto --no-preserve=ownership "$RUNNER_TEMP/native-inputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-icx-release/." "$tmp_dir/"
          chmod -R a+rX "$tmp_dir"
          rm -rf "$shared_root/$GITHUB_SHA"
          mv -T "$tmp_dir" "$shared_root/$GITHUB_SHA"
      - name: Publish the inputs that passed local verification
        if: matrix.preset == 'icx-release'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-prepared-inputs
          path: ${{ runner.temp }}/native-inputs-${{ github.run_id }}-${{ github.run_attempt }}-icx-release
          if-no-files-found: warn
          retention-days: 1
  deploy:
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, laplace, Laplace-Native, staging]
    timeout-minutes: 5
    steps:
      - name: Deploy the verified Native revision through Operations
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/SaltyPatron/Laplace-Operations/dispatches -f event_type=main-merged -f "client_payload[repository]=$SOURCE_REPOSITORY" -f "client_payload[sha]=$SOURCE_SHA"
          echo "Dispatched Operations with $SOURCE_REPOSITORY at $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
