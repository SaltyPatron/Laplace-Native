# Laplace-Native on its runner: built with icx (the primary compiler) and with gcc (the check that results do not
# depend on the compiler), its tests run under both. The runner's environment (runner/.env, from agents.sh) names its
# build root and the machine's dependency sources and ICU. Laplace-Operations is checked out beside the code: the
# floating-point contract and laplace-math are its.
name: Laplace-Native
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  native:
    runs-on: [self-hosted, laplace, Laplace-Native]
    strategy:
      matrix: { preset: [icx-release, gcc-release] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: .operations/Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      # The header-only libraries laplace_linalg compiles against (Eigen, Spectra), checked out at the manifest's pins
      # under the runner's own build root; a row not in the manifest leaves laplace_linalg unbuilt, as before.
      - name: header-only dependencies at their pins
        run: |
          tsv=$GITHUB_WORKSPACE/.operations/Laplace-Operations/dependencies.tsv
          for name in eigen spectra; do
            row=$(awk -F'\t' -v n=$name '$1 == n && $7 == "headers"' "$tsv")
            [ -n "$row" ] || { echo "$name: not in the manifest"; continue; }
            origin=$(echo "$row" | cut -f4); pin=$(echo "$row" | cut -f6); dir=$LAPLACE_BUILD/deps-src/$name
            [ -d "$dir/.git" ] || git clone -q --filter=blob:none --no-checkout "$origin" "$dir"
            git -C "$dir" fetch -q origin "$pin" && git -C "$dir" -c advice.detachedHead=false checkout -q "$pin"
            test "$(git -C "$dir" rev-parse HEAD)" = "$pin"
            echo "LAPLACE_$(echo $name | tr a-z A-Z)_DIR=$dir" >> "$GITHUB_ENV"; echo "$name at $pin"
          done
      - name: build (${{ matrix.preset }})
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export OMP_NUM_THREADS=$(nproc) MKL_NUM_THREADS=$(nproc) LAPLACE_OPERATIONS=$GITHUB_WORKSPACE/.operations/Laplace-Operations
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
      - name: tests (${{ matrix.preset }})
        run: ctest --test-dir "$LAPLACE_BUILD/Laplace-Native/${{ matrix.preset }}" --output-on-failure
