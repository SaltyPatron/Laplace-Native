name: Tier-0 native artifact
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'include/**', 'tools/tier0.c', 'tests/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/tier0.yml']
  push:
    branches: [main]
    paths: ['src/**', 'include/**', 'tools/tier0.c', 'tests/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/tier0.yml']
permissions:
  contents: read
concurrency:
  group: tier0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc, cc: gcc, cxx: g++ }
          - { name: clang, cc: clang, cxx: clang++ }
    env:
      LAPLACE_BUILD: ${{ runner.temp }}/build/Laplace
      LAPLACE_OPERATIONS: ${{ github.workspace }}/.operations/Laplace-Operations
      LAPLACE_UCD: ${{ runner.temp }}/build/Laplace/ucd17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Operations
          ref: 68f7d6152573490b85eabbba93659e8376ed1149
          path: .operations/Laplace-Operations
          persist-credentials: false
      - name: Prepare pinned native dependencies and the complete Unicode 17 bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LAPLACE_BUILD/deps-src" "$LAPLACE_UCD/ucd/extracted" "$LAPLACE_UCD/uca"
          for name in blake3 core-math; do
            row=$(awk -F'\t' -v name="$name" '$1 == name {print $4 " " $6}' "$LAPLACE_OPERATIONS/dependencies.tsv")
            read -r origin pin <<< "$row"
            test -n "$origin" && test -n "$pin"
            dir="$LAPLACE_BUILD/deps-src/$name"
            git init -q "$dir"
            git -C "$dir" remote add origin "$origin"
            git -C "$dir" fetch -q --depth 1 origin "$pin"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$pin"
          done
          for relative in ucd/extracted/DerivedGeneralCategory.txt ucd/PropList.txt ucd/Blocks.txt ucd/UnicodeData.txt uca/allkeys.txt; do
            curl --fail --location --retry 3 "https://www.unicode.org/Public/17.0.0/$relative" -o "$LAPLACE_UCD/$relative"
            sha256sum "$LAPLACE_UCD/$relative"
          done
      - name: Build the production bootstrap and its runtime verification
        shell: bash
        run: |
          set -euo pipefail
          build="$LAPLACE_BUILD/Laplace-Native/${{ matrix.name }}"
          cmake -S . -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DLAPLACE_OPERATIONS="$LAPLACE_OPERATIONS" \
            -DLAPLACE_BLAKE3_DIR="$LAPLACE_BUILD/deps-src/blake3/c" \
            -DLAPLACE_COREMATH="$LAPLACE_BUILD/deps-src/core-math" \
            -DLAPLACE_TIER0="$build/tier0.bin"
          cmake --build "$build" --target laplace_tier0 test_tier0 --parallel 4
      - name: Generate and exercise the full scalar cache
        shell: bash
        run: |
          set -euo pipefail
          build="$LAPLACE_BUILD/Laplace-Native/${{ matrix.name }}"
          "$build/laplace-tier0" "$LAPLACE_UCD" "$build/tier0.bin" | tee "$build/generation.txt"
          "$build/laplace-tier0" "$LAPLACE_UCD" "$build/tier0-independent.bin"
          test "$(stat -c%s "$build/tier0.bin")" = 71172096
          cmp "$build/tier0.bin" "$build/tier0-independent.bin"
          "$build/tests/test_tier0" "$build/tier0.bin" "$build/tier0-independent.bin"
          ctest --test-dir "$build" -R '^test_tier0$' --no-tests=error --output-on-failure --output-junit "$build/tier0.xml"
          awk '/^BLAKE3-256 / {print $2}' "$build/generation.txt" > "$build/tier0.digest"
          test "$(wc -l < "$build/tier0.digest")" = 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tier0-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/build/Laplace/Laplace-Native/${{ matrix.name }}/tier0.digest
            ${{ runner.temp }}/build/Laplace/Laplace-Native/${{ matrix.name }}/tier0.xml
          if-no-files-found: error
  determinism:
    needs: artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: 'tier0-*', path: receipts }
      - name: Require identical GCC and Clang cache fingerprints
        run: cmp receipts/tier0-gcc/tier0.digest receipts/tier0-clang/tier0.digest
